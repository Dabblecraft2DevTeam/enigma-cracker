name: Build Windows GUI EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
    
    - name: Build standalone EXE
      run: |
        pyinstaller --onefile --windowed --name "EnigmaCracker" --add-binary "enigma_cracker.exe;." --add-data "german_words.txt;." --add-data "enigma_kernel.cl;." enigma_gui.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EnigmaCracker-windows
        path: dist/EnigmaCracker.exe
    
    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/EnigmaCracker.exe
        name: Enigma Cracker ${{ github.ref_name }}
        body: |
          ## Enigma Cracker ${{ github.ref_name }}
          
          ### Download
          **EnigmaCracker.exe** — Standalone Windows GUI application
          - No installation needed — just double-click
          - Includes Python runtime + Tkinter GUI + C cracker backend
          - German dictionary-based word scoring (2800+ words)
          - OpenMP enabled for multi-core CPUs
          - OpenCL GPU acceleration support (AMD/NVIDIA)
          - All 8 rotors (I-VIII) searched in M3 and M4 modes
          - X word separator handling for German Enigma messages
          
          ### Usage
          1. Download EnigmaCracker.exe
          2. Double-click to open the GUI
          3. Paste Enigma ciphertext into the text field
          4. Select M3 or M4 mode
          5. Select CPU or GPU backend
          6. Click Crack
          
          ### Performance (24 threads / AMD 9070 XT GPU)
          | Mode | Configs | CPU Time | GPU Time |
          |------|---------|----------|----------|
          | M3 | 11.8M | ~5s | ~0.01s |
          | M4 | 614M | ~40s | ~0.3s |
          
          ### Features
          - Full Enigma M3 (3-rotor) and M4 (4-rotor Naval) simulation
          - All rotors I-VIII + beta + gamma
          - All reflectors B, C, B_thin, C_thin
          - Brute force: rotor permutations × positions × ring settings
          - Fitness: Index of Coincidence + German dictionary + trigram scoring
          - Hill climbing on plugboard
          - X word separator handling
          - GPU acceleration via OpenCL (AMD/NVIDIA)
          - CPU fallback via OpenMP
          - Cross-platform: Linux (gcc), Windows (MinGW)