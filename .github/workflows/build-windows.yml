name: Build Windows GUI EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install PyInstaller
      run: pip install pyinstaller
    
    - name: Clean and Build
      run: |
        # Clean any stale binaries
        if (Test-Path enigma_cracker.exe) { Remove-Item enigma_cracker.exe -Force }
        if (Test-Path enigma_cracker_gpu.exe) { Remove-Item enigma_cracker_gpu.exe -Force }
        if (Test-Path dist) { Remove-Item dist -Recurse -Force }
        if (Test-Path build) { Remove-Item build -Recurse -Force }
        if (Test-Path EnigmaCracker.spec) { Remove-Item EnigmaCracker.spec -Force }
        
        # Verify source has 8 rotors
        Select-String -Path enigma_cracker.c -Pattern "sr\[8\]" | ForEach-Object { Write-Host $_.Line }
        Select-String -Path enigma_cracker.c -Pattern "0.035" | ForEach-Object { Write-Host $_.Line }
        Select-String -Path enigma_cracker.c -Pattern "top_rings = ncand" | ForEach-Object { Write-Host $_.Line }
        
        # Build CPU binary
        gcc -O3 -fopenmp -o enigma_cracker.exe enigma_cracker.c -lm
        Write-Host "CPU binary built: $((Get-Item enigma_cracker.exe).Length) bytes"
        
        # Verify binary has 8 rotors by checking config count in output
        $test = ./enigma_cracker.exe --ct "TEST" --mode M3 2>&1
        Write-Host "Test output: $test"
        
        # Build PyInstaller bundle
        pyinstaller --onefile --windowed --name "EnigmaCracker" --add-binary "enigma_cracker.exe;." --add-data "german_words.txt;." --add-data "enigma_kernel.cl;." --add-data "enigma_cracker_gpu.c;." enigma_gui.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EnigmaCracker-windows
        path: dist/EnigmaCracker.exe
    
    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/EnigmaCracker.exe
        name: Enigma Cracker ${{ github.ref_name }}
        body: |
          ## Enigma Cracker ${{ github.ref_name }}
          
          ### Download
          **EnigmaCracker.exe** — Standalone Windows GUI application
          - No installation needed — just double-click
          - Includes Python runtime + Tkinter GUI + C cracker backend
          - German dictionary-based word scoring (2800+ words)
          - OpenMP enabled for multi-core CPUs
          - OpenCL GPU support (compiled locally if GPU drivers present)
          - All 8 rotors (I-VIII) searched in M3 and M4 modes
          - X word separator handling
          
          ### Usage
          1. Download EnigmaCracker.exe
          2. Double-click to open the GUI
          3. Paste Enigma ciphertext into the text field
          4. Select M3 or M4 mode
          5. Select CPU or GPU backend
          6. Click Crack
          
          ### Performance (24 threads / AMD 9070 XT GPU)
          | Mode | Configs | CPU Time | GPU Time |
          |------|---------|----------|----------|
          | M3 | 11.8M | ~5s | ~0.01s |
          | M4 | 614M | ~75s | ~0.3s |